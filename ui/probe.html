<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>align 探针</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        padding: 16px;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      h1 { font-size: 14px; margin: 0 0 4px; }
      p { margin: 0 0 12px; opacity: 0.75; }
      button {
        font: inherit;
        padding: 6px 10px;
        margin: 0 6px 6px 0;
        border-radius: 6px;
        border: 1px solid currentColor;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
      button:hover { background: rgba(127, 127, 127, 0.15); }
      pre {
        margin: 8px 0 0;
        padding: 8px;
        max-height: 320px;
        overflow: auto;
        background: rgba(127, 127, 127, 0.12);
        border-radius: 6px;
        font-size: 11px;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .caps { font-size: 11px; opacity: 0.8; margin: 0 0 10px; }
    </style>
  </head>
  <body>
    <h1>align 探针</h1>
    <p id="status">正在与宿主握手…</p>
    <p class="caps" id="caps"></p>

    <div>
      <button id="btn-ctx" disabled>试 ui/update-model-context</button>
      <button id="btn-msg" disabled>试 ui/message</button>
      <button id="btn-tool" disabled>试 tools/call</button>
    </div>

    <pre id="log"></pre>

    <script>
      (() => {
        const statusEl = document.getElementById("status");
        const capsEl = document.getElementById("caps");
        const logEl = document.getElementById("log");
        const buttons = {
          ctx: document.getElementById("btn-ctx"),
          msg: document.getElementById("btn-msg"),
          tool: document.getElementById("btn-tool")
        };

        let nextId = 1;
        const pending = new Map();

        function log(...parts) {
          const line = parts
            .map((part) =>
              typeof part === "string" ? part : JSON.stringify(part, null, 0)
            )
            .join(" ");
          logEl.textContent += `${line}\n`;
          logEl.scrollTop = logEl.scrollHeight;
        }

        function request(method, params) {
          const id = nextId++;
          const message = { jsonrpc: "2.0", id, method, params };
          log("→", message);
          window.parent.postMessage(message, "*");
          return new Promise((resolve) => pending.set(id, resolve));
        }

        function notify(method, params) {
          const message = { jsonrpc: "2.0", method, params };
          log("→", message);
          window.parent.postMessage(message, "*");
        }

        window.addEventListener("message", (event) => {
          const data = event.data;
          if (!data || typeof data !== "object" || data.jsonrpc !== "2.0") return;

          if (data.id !== undefined && pending.has(data.id)) {
            const resolve = pending.get(data.id);
            pending.delete(data.id);
            log("←", data);
            resolve(data);
            return;
          }

          log("←", data);
        });

        async function handshake() {
          // 1) ui/initialize —— 约定：app 先发，宿主回 hostCapabilities
          const response = await request("ui/initialize", {
            appInfo: { name: "align-probe-panel", version: "0.0.1" },
            appCapabilities: {},
            protocolVersion: "2025-11-21"
          });

          const result = response?.result ?? {};
          const hostCaps = result.hostCapabilities ?? {};

          statusEl.textContent = result.protocolVersion
            ? `已握手，协商版本 ${result.protocolVersion}`
            : "握手未返回协议版本，见下方日志";

          const flags = [
            ["message", hostCaps.message],
            ["updateModelContext", hostCaps.updateModelContext],
            ["serverResources", hostCaps.serverResources],
            ["logging", hostCaps.logging]
          ];
          capsEl.textContent = `宿主能力：${flags
            .map(([name, value]) => `${name}=${value ? "有" : "无"}`)
            .join("　")}`;

          // 2) 通知宿主：初始化完成
          notify("ui/notifications/initialized", {});

          Object.values(buttons).forEach((button) => {
            button.disabled = false;
          });
        }

        buttons.ctx.addEventListener("click", async () => {
          const marker = `ALIGN_PROBE_CTX_${Date.now()}`;
          const response = await request("ui/update-model-context", {
            content: [
              {
                type: "text",
                text: `align 探针标记：${marker}。这是通过 ui/update-model-context 注入的模型上下文。`
              }
            ],
            structuredContent: {
              probe: "update-model-context",
              marker
            }
          });
          log(`本次注入的标记是 ${marker}`);
          log(
            "update-model-context 完成，",
            response?.error ? `失败：${response.error.message}` : "成功"
          );
        });

        buttons.msg.addEventListener("click", async () => {
          const marker = `ALIGN_PROBE_MSG_${Date.now()}`;
          const response = await request("ui/message", {
            role: "user",
            content: [
              {
                type: "text",
                text: `align 探针标记：${marker}。这条消息由面板通过 ui/message 发出。`
              }
            ]
          });
          log(`本次发出的标记是 ${marker}`);
          log(
            "ui/message 完成，",
            response?.error ? `失败：${response.error.message}` : "成功"
          );
        });

        buttons.tool.addEventListener("click", async () => {
          const response = await request("tools/call", {
            name: "probe_open_panel",
            arguments: {}
          });
          log(
            "tools/call 完成，",
            response?.error ? `失败：${response.error.message}` : "成功"
          );
        });

        handshake().catch((error) => {
          statusEl.textContent = `握手失败：${error}`;
          log("握手异常", String(error));
        });
      })();
    </script>
  </body>
</html>
