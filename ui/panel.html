<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>align</title>
    <style>
      /* 主题用半透明灰而非写死的色值：宿主面板的底色不由我们定，灰在两个主题下都能落住。
         唯一的彩色是强调色与"退休"的红——后者是因为退休不可逆，值得一个警告性的样子。 */
      :root {
        color-scheme: light dark;
        --line: rgba(127, 127, 127, 0.28);
        --line-strong: rgba(127, 127, 127, 0.48);
        --fill: rgba(127, 127, 127, 0.10);
        --fill-strong: rgba(127, 127, 127, 0.20);
        --accent: #3f6fe0;
        --accent-ring: rgba(63, 111, 224, 0.28);
        --danger: #c0392b;
        --radius: 10px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --accent: #8fb0ff;
          --accent-ring: rgba(143, 176, 255, 0.30);
          --danger: #ff9a8f;
        }
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 14px 14px 20px;
        font: 13px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      header { display: flex; align-items: center; gap: 9px; }
      .mark {
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        border-radius: 7px;
        background: var(--fill-strong);
        color: var(--accent);
        flex: none;
      }
      h1 { font-size: 13.5px; font-weight: 650; margin: 0; flex: 1; letter-spacing: 0.01em; }
      h2 {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        opacity: 0.55;
        margin: 20px 0 8px;
      }
      h2 .n {
        font-variant-numeric: tabular-nums;
        letter-spacing: normal;
        font-size: 10.5px;
        padding: 1px 6px;
        border-radius: 999px;
        background: var(--fill);
        opacity: 0.9;
      }
      h2 .n:empty { display: none; }
      .counts {
        font-size: 11px;
        opacity: 0.7;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .counts[hidden] { display: none; }
      #full[hidden] { display: none; }

      .notice {
        margin: 12px 0 0;
        padding: 9px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--fill);
        font-size: 12px;
        word-break: break-word;
      }
      .notice[hidden] { display: none; }

      .item {
        position: relative;
        padding: 10px 11px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        margin-bottom: 8px;
        word-break: break-word;
      }
      .item.editing {
        border-color: var(--accent);
        background: var(--fill);
        box-shadow: 0 0 0 2px var(--accent-ring);
      }
      .item.inactive {
        border-style: dashed;
        opacity: 0.72;
      }

      .meta {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
        font-size: 11px;
        margin-bottom: 6px;
      }
      .meta .id {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.02em;
        padding: 2px 6px;
        border-radius: 5px;
        background: var(--fill);
      }
      .meta .type {
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid var(--line);
        opacity: 0.85;
      }
      .meta .state {
        padding: 2px 8px;
        border-radius: 999px;
        background: var(--fill);
        opacity: 0.85;
      }
      .meta .date {
        color: inherit;
        opacity: 0.6;
        font-variant-numeric: tabular-nums;
      }

      .statement { margin: 0; overflow-wrap: anywhere; }

      .actions { display: flex; gap: 6px; margin-top: 9px; flex-wrap: wrap; }
      button {
        font-family: inherit;
        font-size: 12px;
        line-height: 1.2;
        font-weight: 500;
        padding: 5px 11px;
        border-radius: 7px;
        border: 1px solid var(--line-strong);
        background: transparent;
        color: inherit;
        cursor: pointer;
        transition: background 0.12s ease, border-color 0.12s ease;
      }
      button:hover:not(:disabled) { background: var(--fill-strong); }
      button:disabled { opacity: 0.45; cursor: default; }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      button.primary {
        border-color: var(--accent);
        color: var(--accent);
        background: var(--fill);
      }
      button.primary:hover:not(:disabled) { background: var(--accent-ring); }
      button.danger { border-color: var(--danger); color: var(--danger); }
      button.danger:hover:not(:disabled) { background: var(--accent-ring); }
      #expand, #refresh { flex: none; opacity: 0.85; }

      .aside {
        margin: 0 0 8px;
        padding: 7px 9px;
        border: 1px dashed var(--line-strong);
        border-radius: 8px;
        font-size: 11.5px;
        line-height: 1.5;
      }
      .aside[hidden] { display: none; }

      .chips { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 7px; }
      .chip {
        font-size: 11px;
        padding: 4px 10px;
        border-radius: 999px;
        border: 1px solid var(--line);
        opacity: 0.72;
      }
      .chip.on {
        opacity: 1;
        border-color: var(--accent);
        color: var(--accent);
        background: var(--fill);
      }

      textarea {
        width: 100%;
        font-family: inherit;
        font-size: 12.5px;
        line-height: 1.5;
        padding: 8px;
        border-radius: 8px;
        border: 1px solid var(--line-strong);
        /* 别用 transparent：宿主 iframe 里的底色不由我们定，透明会让文字和背景撞色。 */
        background-color: var(--fill);
        color: inherit;
        min-height: 60px;
        resize: vertical;
        margin-bottom: 7px;
      }
      textarea:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 2px var(--accent-ring);
      }

      .empty {
        padding: 16px 12px;
        text-align: center;
        border: 1px dashed var(--line);
        border-radius: var(--radius);
        font-size: 12px;
        opacity: 0.7;
        margin: 0;
      }

      .result:empty { display: none; }
      .result {
        margin-top: 14px;
        padding: 9px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--fill);
        font-size: 12px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .result.error { border-color: var(--danger); color: var(--danger); }

      .hint { font-size: 11px; line-height: 1.6; opacity: 0.6; margin-top: 16px; }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10.5px;
        padding: 1px 4px;
        border-radius: 4px;
        background: var(--fill);
      }
    </style>
  </head>
  <body>
    <header>
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3.5" y="4.5" width="17" height="15" rx="3.5"></rect>
          <path d="M7.5 9.5h9M7.5 13h5.5"></path>
        </svg>
      </span>
      <h1>对齐账本</h1>
      <span class="counts" id="counts" hidden></span>
      <button id="expand" hidden>在侧边打开</button>
      <button id="refresh" disabled>刷新</button>
    </header>

    <p class="notice" id="notice">正在与宿主握手…</p>

    <!-- 整份账本只在展开时渲染。主线里留下的那一份必须**小巧**：
         历史消息会被宿主重新挂载，如果这里还是整份账本，上滑翻记录时主线里就会
         一次次铺开一大块（2026-10-07 用户报的第二个现象）。 -->
    <div id="full">
      <section>
        <h2>生效中 <span class="n" id="activeCount"></span></h2>
        <p class="aside" id="dropped" hidden></p>
        <div id="active"></div>
      </section>

      <section id="inactiveSection" hidden>
        <h2>已失效 <span class="n" id="inactiveCount"></span></h2>
        <div id="inactive"></div>
      </section>

      <div class="result" id="result"></div>

      <p class="hint">
        这里改的是<strong>已经落下的</strong>条目。新条目走对话里的原生表单（<code>align_land</code>），不从这个面板落地。
      </p>
    </div>

    <script>
      (() => {
        const noticeEl = document.getElementById("notice");
        const activeEl = document.getElementById("active");
        const inactiveEl = document.getElementById("inactive");
        const inactiveSection = document.getElementById("inactiveSection");
        const activeCountEl = document.getElementById("activeCount");
        const inactiveCountEl = document.getElementById("inactiveCount");
        const refreshEl = document.getElementById("refresh");
        const expandEl = document.getElementById("expand");
        const droppedEl = document.getElementById("dropped");
        const countsEl = document.getElementById("counts");
        const fullEl = document.getElementById("full");
        const resultEl = document.getElementById("result");

        let nextId = 1;
        let hostReady = false;
        // 面板只在"刚被 align_open_ledger 打开的那一次"里认领展开侧栏；
        // 认领过的实例不再重复认领（历史回放也不会）。
        let claimed = false;
        let firstState = null;
        // 正在编辑的那条：{ id, statement, type }。null = 没有在编辑。
        let editing = null;
        let displayMode = "inline";
        const pending = new Map();
        const state = { root: null, items: [], types: [], active: 0, total: 0 };

        function request(method, params) {
          const id = nextId++;
          window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
          return new Promise((resolve) => pending.set(id, resolve));
        }

        function notify(method, params) {
          window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
        }

        function labelOf(slug) {
          return state.types.find((type) => type.slug === slug)?.label ?? slug;
        }

        function isActive(item) {
          return item.status === "active";
        }

        /** 状态那一栏写给用户看：取代的有链，退休的就一个字。 */
        function statusText(item) {
          if (item.status === "retired") return "已退休";
          const match = /^superseded by (C-\d+)$/.exec(item.status);
          if (match) return `已由 ${match[1]} 取代`;
          return item.status;
        }

        function setNotice(text) {
          noticeEl.textContent = text ?? "";
          noticeEl.hidden = !text;
        }

        function setResult(text, isError = false) {
          resultEl.textContent = text ?? "";
          resultEl.className = isError ? "result error" : "result";
        }

        function button(text, handler, disabled = false) {
          const el = document.createElement("button");
          el.textContent = text;
          el.disabled = disabled;
          el.addEventListener("click", handler);
          return el;
        }

        /** 条目头上那一行：编号、类型或状态、日期。 */
        function metaRow(parts) {
          const meta = document.createElement("div");
          meta.className = "meta";
          for (const [className, text] of parts) {
            const span = document.createElement("span");
            span.className = className;
            span.textContent = text;
            meta.append(span);
          }
          return meta;
        }

        function renderActiveItem(item) {
          const card = document.createElement("article");
          card.className = editing?.id === item.id ? "item editing" : "item";

          const meta = metaRow([
            ["id", item.id],
            ["type", labelOf(item.type)],
            ["date", item.date]
          ]);

          if (editing?.id === item.id) {
            const box = document.createElement("textarea");
            box.value = editing.statement;
            box.addEventListener("input", () => {
              editing.statement = box.value;
            });

            // 类型用一排小按钮，不用 <select>：原生的下拉在宿主的 iframe 里底色不由我们定，
            // 收起状态会撞色成一片空白（2026-10-07 真机发现的）。按钮没有这个问题，也更窄。
            const chips = document.createElement("div");
            chips.className = "chips";
            for (const type of state.types) {
              const chip = button(type.label, () => {
                editing.type = type.slug;
                for (const el of chips.children) el.classList.toggle("on", el.textContent === type.label);
              });
              chip.className = `chip${type.slug === editing.type ? " on" : ""}`;
              chips.append(chip);
            }

            const actions = document.createElement("div");
            actions.className = "actions";
            const confirm = button("取代", () => save(item, editing.statement, editing.type), !hostReady);
            confirm.className = "primary";
            actions.append(
              confirm,
              button("取消", () => {
                editing = null;
                render();
              })
            );

            card.append(meta, box, chips, actions);
            return card;
          }

          const statement = document.createElement("p");
          statement.className = "statement";
          statement.textContent = item.statement;

          const actions = document.createElement("div");
          actions.className = "actions";
          const retire = button("退休", () => retireItem(item), !hostReady);
          retire.className = "danger";
          actions.append(
            button("改", () => {
              editing = { id: item.id, statement: item.statement, type: item.type };
              setResult("");
              render();
            }, !hostReady),
            retire
          );

          card.append(meta, statement, actions);
          return card;
        }

        function renderInactiveItem(item) {
          const card = document.createElement("article");
          card.className = "item inactive";

          card.append(
            metaRow([
              ["id", item.id],
              ["state", statusText(item)],
              ["date", item.date]
            ])
          );

          const statement = document.createElement("p");
          statement.className = "statement";
          statement.textContent = item.statement;

          card.append(statement);
          return card;
        }

        function render() {
          const active = state.items.filter(isActive);
          const inactive = state.items.filter((item) => !isActive(item));

          activeEl.textContent = "";
          inactiveEl.textContent = "";

          if (active.length === 0) {
            const empty = document.createElement("p");
            empty.className = "empty";
            empty.textContent = "还没有生效的已确认项。";
            activeEl.append(empty);
          } else {
            for (const item of active) activeEl.append(renderActiveItem(item));
          }

          inactiveSection.hidden = inactive.length === 0;
          for (const item of inactive) inactiveEl.append(renderInactiveItem(item));

          if (hostReady) {
            activeCountEl.textContent = String(active.length);
            inactiveCountEl.textContent = inactive.length === 0 ? "" : String(inactive.length);
          }
          renderCounts();
        }

        /** 侧栏只在两处开：刚打开那一次的认领，以及用户点「在侧边打开」。 */
        async function requestDisplay(mode) {
          const response = await withTimeout(
            request("ui/request-display-mode", { mode }),
            2000
          );
          displayMode = response?.result?.mode ?? displayMode;
          syncMode();
          if (mode === "fullscreen" && displayMode !== "fullscreen") {
            setNotice("宿主没有展开面板——用面板右上角的展开按钮。");
          }
          return displayMode;
        }

        /**
         * 两种形态：展开时是整份账本，收起时只剩一张入口卡片。
         *
         * 收起态**必须小巧**。主线里留下的那份会被宿主重新挂载，整份账本摊在对话里，
         * 上滑翻记录就变成一路铺开（2026-10-07 用户报的第二个现象）。
         */
        function syncMode() {
          const compact = displayMode !== "fullscreen";
          fullEl.hidden = compact;
          countsEl.hidden = !compact;
          expandEl.hidden = !compact;
          refreshEl.hidden = compact;
          renderCounts();
        }

        /** 收起态那一行：几张生效、几张已失效。 */
        function renderCounts() {
          if (!hostReady || countsEl.hidden) return;
          const active = state.items.filter(isActive).length;
          const inactive = state.items.length - active;
          countsEl.textContent =
            inactive > 0 ? `${active} 条生效 · ${inactive} 条已失效` : `${active} 条生效`;
        }

        /**
         * 这一次该不该把侧栏抢过来？
         *
         * 面板每次**挂载**都会跑一遍这段脚本——包括你上滑聊天记录、宿主把历史里的面板
         * 重新挂载起来的时候。早先这里一挂载就无条件要求 fullscreen，于是每滑过一条历史
         * 账本，侧栏就被重新抢一次（2026-10-07 实测：连着打开两个）。现在改成一次性认领：
         * 只有刚被 align_open_ledger 打开的那一次取得到 true，历史回放取不到。
         */
        async function claimOpen() {
          if (claimed || !state.root) return;
          claimed = true;

          // 用裸 request，不走 call()：历史回放里这次调用可能被宿主拒掉，
          // 那不该在面板上留一条报错，让人以为面板坏了。
          const response = await request("tools/call", {
            name: "align_take_open",
            arguments: { root: state.root }
          });

          if (response?.result?.structuredContent?.open === true) {
            setNotice("");
            await requestDisplay("fullscreen");
          }
        }

        /** 等到第一次状态到达（历史回放常常不给状态）。 */
        function waitForState(ms) {
          if (state.root) return Promise.resolve(true);
          return new Promise((resolve) => {
            firstState = resolve;
            setTimeout(() => {
              if (firstState === resolve) {
                firstState = null;
                resolve(false);
              }
            }, ms);
          });
        }

        /** 上限之外的生效项仍在账本里，但不再每轮注入——这件事要写在明面上。 */
        function showHotBlockNote(hotBlock) {
          if (!(hotBlock?.dropped > 0)) {
            droppedEl.hidden = true;
            droppedEl.textContent = "";
            return;
          }
          droppedEl.textContent = `其中 ${hotBlock.dropped} 条超出热块上限（${hotBlock.maxItems}）——仍在账本里，但不再每轮注入。`;
          droppedEl.hidden = false;
        }

        /** 工具回传的 structuredContent 就是完整账本，直接照着重渲染。 */
        function applyState(payload) {
          if (!payload) return;
          if (payload.root) state.root = payload.root;
          if (Array.isArray(payload.items)) state.items = payload.items;
          if (Array.isArray(payload.types)) state.types = payload.types;
          if (payload.hotBlock) showHotBlockNote(payload.hotBlock);
          editing = null;
          render();

          if (typeof payload.message === "string" && payload.message) {
            setResult(payload.message);
          }

          if (firstState && state.root) {
            const arrived = firstState;
            firstState = null;
            arrived(true);
          }
        }

        async function call(name, args) {
          const response = await request("tools/call", {
            name,
            arguments: { ...args, root: state.root ?? undefined }
          });

          if (response?.error) {
            setResult(`失败：${response.error.message}`, true);
            return null;
          }

          const payload = response?.result?.structuredContent ?? null;
          applyState(payload);
          return payload;
        }

        async function save(item, statement, type) {
          setResult("正在改…");
          await call("align_edit", { id: item.id, statement, type });
        }

        async function retireItem(item) {
          setResult("正在退休…");
          await call("align_edit", { id: item.id, retire: true });
        }

        // 刷新走 align_list（只读）而不是 align_open_ledger：后者会放一个新的"可展开"
        // 待取标记，那等于每次点刷新都重新抢一次侧栏。
        refreshEl.addEventListener("click", () => call("align_list", {}));

        expandEl.addEventListener("click", () => requestDisplay("fullscreen"));

        window.addEventListener("message", (event) => {
          const data = event.data;
          if (!data || typeof data !== "object" || data.jsonrpc !== "2.0") return;

          if (data.id !== undefined && pending.has(data.id)) {
            const resolve = pending.get(data.id);
            pending.delete(data.id);
            resolve(data);
            return;
          }

          if (data.method === "ui/notifications/tool-result") {
            applyState(data.params?.structuredContent);
            return;
          }

          // 宿主告诉我们展示方式变了（用户在 inline 与 fullscreen 之间切）。
          if (data.method === "ui/notifications/host-context-changed") {
            const next = data.params?.displayMode;
            if (typeof next === "string") {
              displayMode = next;
              syncMode();
            }
          }
        });

        function withTimeout(promise, ms) {
          return Promise.race([
            promise,
            new Promise((resolve) => setTimeout(() => resolve(null), ms))
          ]);
        }

        /** 没有宿主时别装作能用——把原因说出来，别让人对着一堆死按钮猜。 */
        function noHost(message) {
          hostReady = false;
          setNotice(message);
          refreshEl.disabled = true;
          render();
        }

        (async () => {
          if (window.parent === window) {
            noHost("这里没有 MCP 宿主。这个面板要由 Agent 调 align_open_ledger 打开，不能当普通网页打开。");
            return;
          }

          const response = await withTimeout(
            request("ui/initialize", {
              appInfo: { name: "align-panel", version: "0.2.17" },
              appCapabilities: {},
              protocolVersion: "2025-11-21"
            }),
            2000
          );

          if (!response?.result?.protocolVersion) {
            noHost("宿主没有回应握手。这个面板要由 Agent 调 align_open_ledger 打开。");
            return;
          }

          hostReady = true;
          notify("ui/notifications/initialized", {});
          refreshEl.disabled = false;
          setNotice("");
          syncMode();
          render();

          // 等第一次状态到达。没等到就不认领——连项目根都不知道，不能去抢侧栏。
          const arrived = await waitForState(1500);
          if (arrived) await claimOpen();
        })();
      })();
    </script>
  </body>
</html>
