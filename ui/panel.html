<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>align</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 12px;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      header { display: flex; align-items: baseline; gap: 8px; }
      h1 { font-size: 14px; margin: 0; flex: 1; }
      h2 { font-size: 12px; margin: 16px 0 6px; opacity: 0.65; font-weight: 600; }
      .muted { opacity: 0.7; margin: 4px 0; font-size: 12px; }
      .item {
        padding: 8px;
        border: 1px solid rgba(127, 127, 127, 0.3);
        border-radius: 8px;
        margin-bottom: 8px;
        word-break: break-word;
      }
      .item.inactive { opacity: 0.6; }
      .meta { display: flex; gap: 6px; font-size: 11px; opacity: 0.75; margin-bottom: 4px; }
      .meta .id { font-variant-numeric: tabular-nums; }
      .statement { margin: 0; overflow-wrap: anywhere; }
      .actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
      .chips { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px; }
      button {
        font: inherit;
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 6px;
        border: 1px solid currentColor;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
      button:hover:not(:disabled) { background: rgba(127, 127, 127, 0.15); }
      button:disabled { opacity: 0.45; cursor: default; }
      .chip {
        font-size: 11px;
        padding: 3px 9px;
        border-radius: 999px;
        opacity: 0.7;
      }
      .chip.on {
        opacity: 1;
        background: rgba(127, 127, 127, 0.22);
      }
      textarea {
        width: 100%;
        font: inherit;
        padding: 6px;
        border-radius: 6px;
        border: 1px solid rgba(127, 127, 127, 0.4);
        /* 别用 transparent：宿主 iframe 里的底色不由我们定，透明会让文字和背景撞色。 */
        background-color: rgba(127, 127, 127, 0.12);
        color: inherit;
      }
      textarea { min-height: 56px; resize: vertical; margin-bottom: 6px; }
      .result:empty { display: none; }
      .result {
        margin-top: 12px;
        padding: 8px;
        border-radius: 6px;
        background: rgba(127, 127, 127, 0.12);
        font-size: 12px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .hint { font-size: 11px; opacity: 0.65; margin-top: 10px; }
      code { font-size: 11px; }
    </style>
  </head>
  <body>
    <header>
      <h1>对齐账本</h1>
      <button id="refresh" disabled>刷新</button>
    </header>
    <p class="muted" id="status">正在与宿主握手…</p>

    <section>
      <h2>生效中</h2>
      <div id="active"></div>
    </section>

    <section id="inactiveSection" hidden>
      <h2>已失效</h2>
      <div id="inactive"></div>
    </section>

    <div class="result" id="result"></div>

    <p class="hint">
      这里改的是<strong>已经落下的</strong>条目。新条目走对话里的原生表单（<code>align_land</code>），不从这个面板落地。
    </p>

    <script>
      (() => {
        const statusEl = document.getElementById("status");
        const activeEl = document.getElementById("active");
        const inactiveEl = document.getElementById("inactive");
        const inactiveSection = document.getElementById("inactiveSection");
        const refreshEl = document.getElementById("refresh");
        const resultEl = document.getElementById("result");

        let nextId = 1;
        let hostReady = false;
        // 正在编辑的那条：{ id, statement, type }。null = 没有在编辑。
        let editing = null;
        let displayMode = "inline";
        const pending = new Map();
        const state = { root: null, items: [], types: [], active: 0, total: 0 };

        function request(method, params) {
          const id = nextId++;
          window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
          return new Promise((resolve) => pending.set(id, resolve));
        }

        function notify(method, params) {
          window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
        }

        function labelOf(slug) {
          return state.types.find((type) => type.slug === slug)?.label ?? slug;
        }

        function isActive(item) {
          return item.status === "active";
        }

        /** 状态那一栏写给用户看：取代的有链，退休的就一个字。 */
        function statusText(item) {
          if (item.status === "retired") return "已退休";
          const match = /^superseded by (C-\d+)$/.exec(item.status);
          if (match) return `已由 ${match[1]} 取代`;
          return item.status;
        }

        function button(text, handler, disabled = false) {
          const el = document.createElement("button");
          el.textContent = text;
          el.disabled = disabled;
          el.addEventListener("click", handler);
          return el;
        }

        function renderActiveItem(item) {
          const card = document.createElement("article");
          card.className = "item";

          const meta = document.createElement("div");
          meta.className = "meta";
          for (const text of [item.id, labelOf(item.type), item.date]) {
            const span = document.createElement("span");
            span.textContent = text;
            meta.append(span);
          }

          if (editing?.id === item.id) {
            const box = document.createElement("textarea");
            box.value = editing.statement;
            box.addEventListener("input", () => {
              editing.statement = box.value;
            });

            // 类型用一排小按钮，不用 <select>：原生的下拉在宿主的 iframe 里底色不由我们定，
            // 收起状态会撞色成一片空白（2026-10-07 真机发现的）。按钮没有这个问题，也更窄。
            const chips = document.createElement("div");
            chips.className = "chips";
            for (const type of state.types) {
              const chip = button(type.label, () => {
                editing.type = type.slug;
                for (const el of chips.children) el.classList.toggle("on", el.textContent === type.label);
              });
              chip.className = `chip${type.slug === editing.type ? " on" : ""}`;
              chips.append(chip);
            }

            const actions = document.createElement("div");
            actions.className = "actions";
            actions.append(
              button("保存（取代）", () => save(item, editing.statement, editing.type), !hostReady),
              button("取消", () => {
                editing = null;
                render();
              })
            );

            card.append(meta, box, chips, actions);
            return card;
          }

          const statement = document.createElement("p");
          statement.className = "statement";
          statement.textContent = item.statement;

          const actions = document.createElement("div");
          actions.className = "actions";
          actions.append(
            button("改", () => {
              editing = { id: item.id, statement: item.statement, type: item.type };
              resultEl.textContent = "";
              render();
            }, !hostReady),
            button("退休", () => retire(item), !hostReady)
          );

          card.append(meta, statement, actions);
          return card;
        }

        function renderInactiveItem(item) {
          const card = document.createElement("article");
          card.className = "item inactive";

          const meta = document.createElement("div");
          meta.className = "meta";
          for (const text of [item.id, statusText(item), item.date]) {
            const span = document.createElement("span");
            span.textContent = text;
            meta.append(span);
          }

          const statement = document.createElement("p");
          statement.className = "statement";
          statement.textContent = item.statement;

          card.append(meta, statement);
          return card;
        }

        function render() {
          const active = state.items.filter(isActive);
          const inactive = state.items.filter((item) => !isActive(item));

          activeEl.textContent = "";
          inactiveEl.textContent = "";

          if (active.length === 0) {
            const empty = document.createElement("p");
            empty.className = "muted";
            empty.textContent = "还没有生效的已确认项。";
            activeEl.append(empty);
          } else {
            for (const item of active) activeEl.append(renderActiveItem(item));
          }

          inactiveSection.hidden = inactive.length === 0;
          for (const item of inactive) inactiveEl.append(renderInactiveItem(item));

          if (hostReady) {
            statusEl.textContent = `生效 ${active.length} 条 · 已失效 ${inactive.length} 条`;
          }
        }

        /** 面板要开在侧面、不要占着主线：握手之后立刻要求全屏（宿主里就是侧边面板）。 */
        async function openInSidePanel() {
          const response = await withTimeout(
            request("ui/request-display-mode", { mode: "fullscreen" }),
            2000
          );
          displayMode = response?.result?.mode ?? displayMode;
          if (displayMode !== "fullscreen") {
            statusEl.textContent = "宿主没有展开面板——用面板右上角的展开按钮。";
          }
          render();
        }

        /** 工具回传的 structuredContent 就是完整账本，直接照着重渲染。 */
        function applyState(payload) {
          if (!payload) return;
          if (payload.root) state.root = payload.root;
          if (Array.isArray(payload.items)) state.items = payload.items;
          if (Array.isArray(payload.types)) state.types = payload.types;
          editing = null;
          render();
          if (typeof payload.message === "string" && payload.message) {
            resultEl.textContent = payload.message;
          }
        }

        async function call(name, args) {
          const response = await request("tools/call", {
            name,
            arguments: { ...args, root: state.root ?? undefined }
          });

          if (response?.error) {
            resultEl.textContent = `失败：${response.error.message}`;
            return null;
          }

          const payload = response?.result?.structuredContent ?? null;
          applyState(payload);
          return payload;
        }

        async function save(item, statement, type) {
          resultEl.textContent = "正在改…";
          await call("align_edit", { id: item.id, statement, type });
        }

        async function retire(item) {
          resultEl.textContent = "正在退休…";
          await call("align_edit", { id: item.id, retire: true });
        }

        refreshEl.addEventListener("click", () => call("align_open_ledger", {}));

        window.addEventListener("message", (event) => {
          const data = event.data;
          if (!data || typeof data !== "object" || data.jsonrpc !== "2.0") return;

          if (data.id !== undefined && pending.has(data.id)) {
            const resolve = pending.get(data.id);
            pending.delete(data.id);
            resolve(data);
            return;
          }

          if (data.method === "ui/notifications/tool-result") {
            applyState(data.params?.structuredContent);
            return;
          }

          // 宿主告诉我们展示方式变了（用户在 inline 与 fullscreen 之间切）。
          if (data.method === "ui/notifications/host-context-changed") {
            const next = data.params?.displayMode;
            if (typeof next === "string") displayMode = next;
          }
        });

        function withTimeout(promise, ms) {
          return Promise.race([
            promise,
            new Promise((resolve) => setTimeout(() => resolve(null), ms))
          ]);
        }

        /** 没有宿主时别装作能用——把原因说出来，别让人对着一堆死按钮猜。 */
        function noHost(message) {
          hostReady = false;
          statusEl.textContent = message;
          refreshEl.disabled = true;
          render();
        }

        (async () => {
          if (window.parent === window) {
            noHost("这里没有 MCP 宿主。这个面板要由 Agent 调 align_open_ledger 打开，不能当普通网页打开。");
            return;
          }

          const response = await withTimeout(
            request("ui/initialize", {
              appInfo: { name: "align-panel", version: "0.2.11" },
              appCapabilities: {},
              protocolVersion: "2025-11-21"
            }),
            2000
          );

          if (!response?.result?.protocolVersion) {
            noHost("宿主没有回应握手。这个面板要由 Agent 调 align_open_ledger 打开。");
            return;
          }

          hostReady = true;
          notify("ui/notifications/initialized", {});
          refreshEl.disabled = false;
          render();
          await openInSidePanel();
        })();
      })();
    </script>
  </body>
</html>
